<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>TuzkaOCR</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.75 4.25c0-.69.56-1.25 1.25-1.25h3.1l1.4 1.5H13c.69 0 1.25.56 1.25 1.25v6.25c0 .69-.56 1.25-1.25 1.25H3c-.69 0-1.25-.56-1.25-1.25z"/></symbol>
  <symbol id="i-home" viewBox="0 0 16 16"><path d="M2.5 7 8 2.5 13.5 7v6.25c0 .41-.34.75-.75.75H10V10H6v4H3.25a.75.75 0 0 1-.75-.75z"/></symbol>
  <symbol id="i-desktop" viewBox="0 0 16 16"><rect x="1.75" y="2.5" width="12.5" height="8.5" rx="1"/><path d="M5.5 13.75h5M8 11v2.75"/></symbol>
  <symbol id="i-documents" viewBox="0 0 16 16"><path d="M4 1.75h5l3.25 3.25v8.5c0 .41-.34.75-.75.75H4a.75.75 0 0 1-.75-.75v-11c0-.41.34-.75.75-.75z"/><path d="M8.75 1.75V5.25h3.5M5.5 8.5h5M5.5 11h5"/></symbol>
  <symbol id="i-downloads" viewBox="0 0 16 16"><path d="M8 2v8.25M4.75 7.25 8 10.5l3.25-3.25M2.5 13.75h11"/></symbol>
  <symbol id="i-pictures" viewBox="0 0 16 16"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1"/><circle cx="5.5" cy="6.25" r="1.1"/><path d="m2 12 3.75-3.5 2.5 2.25 2-1.75L14 12"/></symbol>
  <symbol id="i-drive" viewBox="0 0 16 16"><rect x="1.75" y="4.5" width="12.5" height="7" rx="1.25"/><path d="M11 8h.5"/></symbol>
  <symbol id="i-up" viewBox="0 0 16 16"><path d="M8 13V3.5M3.75 7.5 8 3.25l4.25 4.25"/></symbol>
  <symbol id="i-sort" viewBox="0 0 16 16"><path d="M4.5 6.5 8 3l3.5 3.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5"/></symbol>
  <symbol id="i-left" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></symbol>
  <symbol id="i-right" viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 16 16"><path d="m3.5 3.5 9 9M12.5 3.5l-9 9"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="m3 8.5 3.25 3L13 4.75"/></symbol>
  <symbol id="i-alert" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.75v3.75M8 11h.01"/></symbol>
  <symbol id="i-open" viewBox="0 0 16 16"><path d="M9 2.5h4.5V7M13.25 2.75 7.5 8.5M11.5 9.5v3.25c0 .41-.34.75-.75.75h-7.5a.75.75 0 0 1-.75-.75v-7.5c0-.41.34-.75.75-.75H6.5"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <img class="mark" src="icon.png" alt="">
      <span class="brand-name">TuzkaOCR</span>
      <span class="brand-version" id="version"></span>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="cs">Čeština</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="body">
    <nav class="sidebar" aria-label="Places">
      <div class="side-title" data-t="places"></div>
      <ul id="places"></ul>
      <div class="side-title" data-t="drives" id="drives-title" hidden></div>
      <ul id="drives"></ul>
    </nav>

    <main class="browser">
      <div class="pathbar">
        <button type="button" class="icon-btn" id="up" data-tt="up"><svg><use href="#i-up"/></svg></button>
        <ol class="crumbs" id="crumbs"></ol>
        <button type="button" class="secondary small" id="toggle-all" hidden></button>
      </div>
      <div class="listhead" id="listhead" hidden>
        <label class="check"><input type="checkbox" id="select-all"><span></span></label>
        <button type="button" class="sort col-name" data-sort="name"><span data-t="colName"></span><svg aria-hidden="true"><use href="#i-sort"/></svg></button>
        <button type="button" class="sort col-size" data-sort="size"><span data-t="colSize"></span><svg aria-hidden="true"><use href="#i-sort"/></svg></button>
        <button type="button" class="sort col-status" data-sort="status"><span data-t="colStatus"></span><svg aria-hidden="true"><use href="#i-sort"/></svg></button>
      </div>
      <div class="list" id="list" tabindex="-1"></div>
      <div class="listfoot" id="listfoot"></div>
    </main>

    <aside class="panel" id="panel">
      <section class="field">
        <h2 data-t="material"></h2>
        <div class="choices" id="materials"></div>
      </section>
      <section class="field">
        <h2 data-t="formats"></h2>
        <label class="option">
          <input type="checkbox" name="format" value="txt" checked>
          <span class="box"></span>
          <span class="option-text"><span class="option-title" data-t="fTxt"></span><span class="option-sub">.txt</span></span>
        </label>
        <label class="option">
          <input type="checkbox" name="format" value="alto" checked>
          <span class="box"></span>
          <span class="option-text"><span class="option-title">ALTO XML</span><span class="option-sub" data-t="fAltoSub"></span></span>
        </label>
      </section>
      <section class="field">
        <h2 data-t="output"></h2>
        <div class="output-row">
          <p class="output-path" id="output-path"></p>
          <button type="button" class="secondary small" id="output-change" data-t="change"></button>
        </div>
        <p class="note" id="output-default" data-t="outputDefault" hidden></p>
        <p class="note" id="output-note" data-t="outputFallback" hidden></p>
        <p class="note" id="output-custom" hidden><span data-t="outputCustom"></span> <button type="button" class="link" id="output-reset" data-t="outputReset"></button></p>
      </section>

      <div class="run" id="run">
        <div class="idle" id="idle">
          <button type="button" class="primary" id="start"></button>
          <p class="hint" id="start-hint"></p>
        </div>
        <div class="progress" id="progress" hidden>
          <div class="progress-head">
            <span class="progress-title" id="progress-title"></span>
            <span class="progress-count" id="progress-count"></span>
          </div>
          <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
          <p class="progress-detail" id="progress-detail"></p>
          <p class="progress-where" id="progress-where" hidden></p>
          <div class="actions" id="progress-actions"></div>
        </div>
      </div>
    </aside>
  </div>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
  <div class="viewer-bar">
    <button type="button" class="icon-btn" id="viewer-prev" data-tt="prev"><svg><use href="#i-left"/></svg></button>
    <button type="button" class="icon-btn" id="viewer-next" data-tt="next"><svg><use href="#i-right"/></svg></button>
    <span class="viewer-title" id="viewer-title"></span>
    <span class="viewer-pos" id="viewer-pos"></span>
    <button type="button" class="secondary" id="viewer-copy" data-t="copy"></button>
    <button type="button" class="icon-btn" id="viewer-close" data-tt="close"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="viewer-body">
    <div class="viewer-image"><img id="viewer-img" alt=""></div>
    <div class="viewer-text"><pre id="viewer-text"></pre></div>
  </div>
</div>

<div class="picker-backdrop" id="picker" hidden>
  <div class="picker" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <div class="picker-head">
      <h2 id="picker-title" data-t="pickerTitle"></h2>
      <button type="button" class="icon-btn" id="picker-close" data-tt="close"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="picker-body">
      <nav class="picker-places" id="picker-places"></nav>
      <div class="picker-main">
        <div class="pathbar">
          <button type="button" class="icon-btn" id="picker-up" data-tt="up"><svg><use href="#i-up"/></svg></button>
          <ol class="crumbs" id="picker-crumbs"></ol>
        </div>
        <div class="picker-list" id="picker-list"></div>
      </div>
    </div>
    <div class="picker-foot">
      <div class="newfolder" id="newfolder">
        <button type="button" class="secondary" id="newfolder-open"><svg><use href="#i-plus"/></svg><span data-t="newFolder"></span></button>
        <form id="newfolder-form" hidden>
          <input type="text" id="newfolder-name" autocomplete="off" spellcheck="false">
          <button type="submit" class="secondary" data-t="create"></button>
        </form>
        <span class="picker-error" id="picker-error"></span>
      </div>
      <div class="picker-actions">
        <button type="button" class="secondary" id="picker-cancel" data-t="cancel"></button>
        <button type="button" class="primary" id="picker-choose" data-t="chooseFolder"></button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
